<!DOCTYPE html>
<html>
<head>
<style>
    .header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .title-area {
      flex: 1 1 300px; /* grow and shrink, min 300px */
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end; /* when it wraps, align right or left? */
      flex: 1 0 auto;
    }
    .control-box {
      border: 1px solid #ccc;
      padding: 0.5rem;
    }
</style>
</head>
<body>
  <div class="header">
    <div class="title-area">
      <h1>Dashboard</h1>
    </div>
    <div class="controls">
      <div class="control-box">DU 07/07/2026 AU 28/08/2026</div>
      <div class="control-box">PÉRIODE Range</div>
      <div class="control-box">PROJET 5 projets</div>
    </div>
  </div>
</body>
</html>
