<!DOCTYPE html>
<html>
<head>
<style>
.project-filter-btn {
      background: transparent;
      color: #fff;
      border: none;
      outline: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      text-align: left;
      min-width: 130px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .project-filter-btn::after {
      content: '▾';
      font-size: 0.75rem;
      opacity: 0.5;
      flex-shrink: 0;
    }
</style>
</head>
<body style="background: #121212">
  <button class="project-filter-btn">Projects</button>
</body>
</html>
