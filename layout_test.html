<!DOCTYPE html>
<html>
<head>
<style>
    .stat-card {
      width: 250px;
      padding: 1rem;
      border: 1px solid #ccc;
    }
    .stat-value-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .stat-value {
      font-size: 2.25rem;
      font-weight: bold;
      white-space: nowrap;
      line-height: 1.2;
    }
    .stat-suffix {
      color: #9e9e9e;
      font-size: 0.875rem;
      text-align: right;
      margin-left: auto;
    }
</style>
</head>
<body>
  <div class="stat-card">
    <div class="stat-value-container">
      <span class="stat-value">166h 19m</span>
      <span class="stat-suffix">21 jours actifs</span>
    </div>
  </div>
</body>
</html>
